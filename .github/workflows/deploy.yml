name: 公開する

# **マージしても公開されません。** ここを人が手で動かしたときだけ公開します。
#
#   Actions の画面 → 左の「公開する」→ Run workflow → 押すだけ
#
# 選ぶものはありません。**出す先は枝で決まります。**
#
#   main       → 本番（main には PR とテストを通ったものしか入らない）
#   それ以外   → 確認用
#
# 「どこに出すか」を別に選べるようにすると、「作業中の枝を本番に出す」が
# 指定できてしまう。選べなくすれば、その間違いは起こりようがない。
#
# 公開する前に「そのコミットのテストが緑か」を必ず見ます（数秒）。
# テストを走らせ直しはしません。赤いまま／未実行なら日本語で止まります。
#
# そのあと**画面テスト（実ブラウザでスマホ幅を測る）をここで 1 回だけ流します**（10 分前後）。
# PR のたびに流すのは大げさなので、公開の直前だけにしました（ci.yml では流さない）。
# 落ちたら公開に進みません。
# **この確認を飛ばす手段は用意しません。** 逃げ道があると、いつか「とりあえず飛ばす」
# が習慣になります。
#
# Vercel の自動デプロイは vercel.json で切ってあります（切らないと二重に公開される）。
#
# 必要な設定（リポジトリの Settings > Secrets and variables > Actions）:
#   Secrets:
#     VERCEL_TOKEN       … Vercel の Account Settings > Tokens で作る
#     VERCEL_ORG_ID      … vercel link したあと .vercel/project.json の orgId
#     VERCEL_PROJECT_ID  … 同じファイルの projectId
#   Variables（任意）:
#     PREVIEW_ALIAS      … 確認用の固定 URL（例 eriataiko-dev.vercel.app）
#                          入れておくと毎回同じ URL で開ける。空なら毎回別 URL になる。
#
# 手順の詳細は docs/deploy.md。

on:
  workflow_dispatch:

# 公開の途中で打ち切ると中途半端な状態になるので、キャンセルしない。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Vercel に公開
    runs-on: ubuntu-latest
    # 画面テスト（DB の起動・ブラウザの取得を含めて 10 分前後）+ 公開。
    # 40 分を超えたら何かが固まっているので落とす。
    timeout-minutes: 40

    env:
      # vercel CLI はこの 3 つを環境変数から読む。
      # --token フラグで渡すとプロセス一覧に出て漏れるので、フラグでは渡さない。
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # 出す先は枝で決まる。main だけが本番。
      TARGET_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      # 本番のときだけ --prod を足す。確認用のときは空文字になる。
      PROD_FLAG: ${{ github.ref_name == 'main' && '--prod' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: どこに出すか知らせる
        # 押した人が「本番に出そうとしている」と気づけるように、最初にログへ出す。
        run: |
          if [ "$TARGET_ENV" = production ]; then
            echo "### 本番に公開します（枝: ${{ github.ref_name }}）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 確認用に公開します（枝: ${{ github.ref_name }}）" >> "$GITHUB_STEP_SUMMARY"
            echo "本番に出したいときは Use workflow from を main にしてください。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: このコミットのテストが緑か確かめる
        # テストは走らせ直さない（マージのときに走っている）。結果だけ見る。
        # 「テスト」ワークフローのこのコミットぶんの結論を GitHub に問い合わせる。
        #
        # ここを飛ばす手段は用意しない。逃げ道があると、いつか「とりあえず飛ばす」が
        # 習慣になり、赤いまま本番に出る。
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          result=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
            --jq '[.workflow_runs[] | select(.status == "completed")] | first | .conclusion // "なし"')
          echo "このコミット（${SHA}）のテスト結果: ${result}"
          case "$result" in
            success)
              echo "テストは緑です。公開に進みます。" ;;
            なし)
              echo "::error::このコミットのテストがまだ終わっていません（または一度も走っていません）。"
              echo "Actions の「テスト」が緑になるのを待ってから、もう一度やり直してください。"
              echo "ふつうはマージの数分後に緑になります。"
              exit 1 ;;
            *)
              echo "::error::このコミットのテストが ${result} です。赤いものを公開しないで止めました。"
              echo "先にテストを直してください。"
              exit 1 ;;
          esac

      - name: Vercel の設定があるか確かめる
        # 無いまま進むと Vercel CLI の英語エラーで止まって原因が分かりにくい。
        # ここで日本語で止める。画面テスト（10 分前後）より前に見て、待たせてから落とさない。
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ]      || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ]     || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Vercel の設定が足りません:$missing"
            echo "リポジトリの Settings > Secrets and variables > Actions に登録してください。"
            echo "手順は docs/deploy.md にあります。"
            exit 1
          fi

      - name: 画面テストを流すと知らせる
        run: |
          echo "公開の前に画面テストを流します（10 分前後）。落ちたら公開しません。" >> "$GITHUB_STEP_SUMMARY"

      - name: Node を用意する
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: パッケージを入れる
        run: npm ci

      - name: DB を起動する
        # 画面テストは手元と同じく、使い捨ての DB（見本データ入り）に対して流す。
        # 本番の DB には触らない。
        run: npx supabase start

      - name: DB の接続情報を .env.test に書き直す
        run: npm run test:env

      - name: 日本語フォントを入れる
        # **画面テストの命綱。** 下の「画面テスト」は 390px で崩れていないかを
        # 数値で測る。日本語の字形が変われば文字幅も変わり、測定が意味を失う。
        #
        # 入れるのは Noto Sans JP。src/app/globals.css の --font-material が
        # 'Noto Sans JP' を名指ししており、Android の実機で使われるものと同じ。
        #
        # 以前は下の `--with-deps` が Ubuntu の配布サーバーから日本語フォント
        # （fonts-ipafont-gothic）を取ってきていた。だがそこが不調だと止まる。
        # 2026-08-19 は 10 分 28 秒無言になり、人が手で止めた。npm から入れれば
        # 版が package-lock.json で固定され、外の配布サーバーに一切触らない。
        run: |
          set -euo pipefail
          mkdir -p ~/.fonts
          cp node_modules/@expo-google-fonts/noto-sans-jp/400Regular/*.ttf ~/.fonts/
          cp node_modules/@expo-google-fonts/noto-sans-jp/700Bold/*.ttf ~/.fonts/
          fc-cache -f
          # 本当にそれが選ばれるかを見る。ここが違うフォントを指していたら、
          # 下の測定は当てにならない。
          echo "日本語に使われるフォント: $(fc-match -f '%{family}' 'Noto Sans JP')"

      - name: ブラウザを入れる
        # `--with-deps` は付けない。あれは OS の部品を Ubuntu の配布サーバーから取りに行くが、
        # ubuntu-latest には最初から入っている。足りない日本語フォントは上の手順で npm から入れている。
        run: npx playwright install chromium

      - name: 画面テスト
        # スマホ幅（390px）で崩れていないか、入場からの流れが動くかを実際に確かめる。
        run: |
          if ! npm run test:e2e; then
            echo "::error::画面テストが落ちたので、公開を止めました。下の「失敗したときの記録」を見て直してください。"
            echo "### 画面テストが落ちたので公開していません" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "画面テストは通りました。公開に進みます。" >> "$GITHUB_STEP_SUMMARY"

      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Vercel CLI を入れる
        run: npm i -g vercel@latest

      - name: Vercel から設定と環境変数を取ってくる
        # Supabase の URL や鍵は Vercel 側に置いてある。GitHub には置かない。
        run: vercel pull --yes --environment="$TARGET_ENV"

      - name: ビルドする
        # PROD_FLAG は空になることがあるので、あえて "" で囲まない。
        # shellcheck disable=SC2086
        run: vercel build $PROD_FLAG

      - name: 公開する
        id: deploy
        # vercel CLI が返す JSON は 2 通りある。--json を付けると平ら（.url）、
        # 付けないと入れ子（.deployment.url）。版によっても変わりうるので、
        # 両方拾う。実際に片方だけ見ていて落ちた。
        # shellcheck disable=SC2086
        run: |
          set -euo pipefail
          out=$(vercel deploy --prebuilt $PROD_FLAG --json)
          url=$(jq -r '.deployment.url // .url // empty' <<<"$out")
          if [ -z "$url" ]; then
            echo "::error::公開できましたが URL が取れませんでした。出力の形が変わった可能性があります。"
            echo "$out"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "## 公開しました" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TARGET_ENV" = production ]; then
            echo "**本番**: https://eriataiko.vercel.app" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "この回だけの URL（ログインが必要）: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**確認用**: $url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 確認用の固定 URL を貼り替える
        # PREVIEW_ALIAS を設定していれば、毎回同じ URL で開けるようにする。
        # 未設定なら何もしない（上の一時 URL をそのまま使う）。
        if: env.TARGET_ENV == 'preview' && vars.PREVIEW_ALIAS != ''
        run: |
          set -euo pipefail
          vercel alias set "${{ steps.deploy.outputs.url }}" "${{ vars.PREVIEW_ALIAS }}"
          echo "**固定URL**: https://${{ vars.PREVIEW_ALIAS }}" >> "$GITHUB_STEP_SUMMARY"
