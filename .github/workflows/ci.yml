name: テスト

# いつ動くか:
#   - develop / main に向けて PR を作ったとき
#   - develop / main にマージされたとき
#
# **公開はしない。** 公開は「公開する」ワークフロー（deploy.yml）を
# 人が手で動かしたときだけ走る。
#
# マージのたびに公開まで走るのは無駄なので分けた。
# ただし公開側はこのワークフローの結果を見て、緑でなければ止まる。

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 同じブランチに続けて push したら、古い実行は打ち切る。
# 最新のコードだけ確かめれば十分なので、待ち時間を無駄にしない。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 型・lint・テスト・画面
    runs-on: ubuntu-latest
    # DB の起動とブラウザの取得を含めて 5 分前後。
    # 20 分を超えたら何かが固まっているので落とす。
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Node を用意する
        uses: actions/setup-node@v4
        with:
          # 手元と同じ版を使う（.node-version は 1 箇所で管理する）
          node-version-file: .node-version
          cache: npm

      - name: パッケージを入れる
        run: npm ci

      - name: 型・lint・整形
        run: npm run check

      - name: DB を起動する
        # tests/rls.test.ts が本物の DB に対して「他人に書き換えられないか」を確かめる。
        # 本番が壊れる設定ミスを実際にここで捕まえたので、CI でも必ず起動する。
        run: npx supabase start

      - name: DB の接続情報を .env.test に書き直す
        # Supabase の CLI が上がると鍵が変わることがある。
        # 毎回いま動いている DB から作り直せば、鍵ずれで落ちなくなる。
        run: npm run test:env

      - name: テスト
        run: npm test

      - name: ブラウザを入れる
        # `--with-deps` は外さないこと。**日本語フォント（fonts-ipafont-gothic）を
        # 入れているのがこれ。** 外すと日本語が別の字形で描かれ、文字幅が変わる。
        # このリポジトリの画面テストは 390px で崩れないかを**数値で測る**ので、
        # 字形が違えば測定そのものが無意味になる（実際に外したら星取表が
        # はみ出さなくなり、横スクロールのテストが落ちた）。
        #
        # ただし `--with-deps` は Ubuntu の配布サーバーから取ってくるので、
        # 向こうが不調だと止まる。2026-08-19 に 10 分 28 秒無言になり、人が手で止めた。
        # 5 分で見切りをつけて 1 回だけやり直す。つまずきはたいてい一時的なもの。
        run: |
          set -uo pipefail
          for i in 1 2; do
            if timeout -k 30 300 npx playwright install --with-deps chromium; then
              echo "入りました（${i} 回目）"
              exit 0
            fi
            echo "::warning::${i} 回目が 5 分で終わりませんでした。やり直します。"
          done
          echo "::error::2 回とも失敗しました。Ubuntu の配布サーバーが不調の可能性が高いです。"
          exit 1

      - name: 画面テスト
        # スマホ幅（390px）で崩れていないかを実際に測る。
        # 見た目の判断は当てにならないので、必ずここで数値を取る。
        run: npm run test:e2e

      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
