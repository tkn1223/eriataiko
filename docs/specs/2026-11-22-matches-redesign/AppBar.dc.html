<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;overflow:hidden;height:60px;flex-shrink:0;background:radial-gradient(90% 120% at 100% 0%, rgba(213,162,60,0.38), rgba(213,162,60,0) 55%), linear-gradient(160deg,#2B3038 0%,#171B21 55%,#0E1115 100%);color:#FFFFFF;display:flex;align-items:center;gap:12px;padding:0 16px">
  <div style="position:absolute;left:-10%;right:-10%;bottom:-42px;height:60px;border-top:1.5px solid rgba(232,190,100,0.75);border-radius:50%;filter:drop-shadow(0 -2px 4px rgba(232,190,100,0.6))"></div>
  <svg width="24" height="30" viewBox="0 0 26 30" fill="none" style="position:relative;flex-shrink:0"><path d="M3 2 L10 20 M23 2 L16 20 M8 2 L11.5 20 M18 2 L14.5 20 M13 2 V20" stroke="#E8EAEE" stroke-width="1.3" stroke-linecap="round"></path><path d="M3 2 Q13 5 23 2" stroke="#C7CCD2" stroke-width="1.2"></path><path d="M9 20 H17 V23 A4 4 0 0 1 9 23 Z" fill="#D5A23C"></path></svg>
  <div style="position:relative;min-width:0;display:flex;flex-direction:column;gap:1px">
    <div style="font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ title }}</div>
    <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ true }}">
      <div style="font-size:12px;font-weight:500;color:#D9D6CF;white-space:nowrap">{{ sub }}</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:60},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;見本 第1回 アサヒ杯バドミントン大会&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { title: this.props.title ?? '見本 第1回 アサヒ杯バドミントン大会', sub: this.props.sub ?? '', hasSub: !!this.props.sub };
  }
}
</script>
</body>
</html>
