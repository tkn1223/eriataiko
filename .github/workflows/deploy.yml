name: 公開する

# **マージしても公開されません。** ここを人が手で動かしたときだけ公開します。
#
#   Actions の画面 → 左の「公開する」→ Run workflow
#     Use workflow from … どの枝の中身を出すか（main = 本番のコード）
#     どこに出す？       … 確認用 / 本番
#
# 「本番」は main からしか選べません（確認していないコードが本番に出る事故を防ぐため）。
#
# 公開する前に「そのコミットのテストが緑か」だけ見ます（数秒）。
# テストを走らせ直しはしません。赤いまま／未実行なら日本語で止まります。
#
# Vercel の自動デプロイは vercel.json で切ってあります（切らないと二重に公開される）。
#
# 必要な設定（リポジトリの Settings > Secrets and variables > Actions）:
#   Secrets:
#     VERCEL_TOKEN       … Vercel の Account Settings > Tokens で作る
#     VERCEL_ORG_ID      … vercel link したあと .vercel/project.json の orgId
#     VERCEL_PROJECT_ID  … 同じファイルの projectId
#   Variables（任意）:
#     PREVIEW_ALIAS      … 確認用の固定 URL（例 eriataiko-dev.vercel.app）
#                          入れておくと毎回同じ URL で開ける。空なら毎回別 URL になる。
#
# 手順の詳細は docs/deploy.md。

on:
  workflow_dispatch:
    inputs:
      target:
        description: どこに出す？
        type: choice
        required: true
        default: 確認用
        options:
          - 確認用
          - 本番
      skip_test_check:
        description: テストが緑かの確認を飛ばす（ふだんは触らない）
        type: boolean
        required: false
        default: false

# 公開の途中で打ち切ると中途半端な状態になるので、キャンセルしない。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Vercel に公開
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # vercel CLI はこの 3 つを環境変数から読む。
      # --token フラグで渡すとプロセス一覧に出て漏れるので、フラグでは渡さない。
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TARGET_ENV: ${{ inputs.target == '本番' && 'production' || 'preview' }}
      # 本番のときだけ --prod を足す。確認用のときは空文字になる。
      PROD_FLAG: ${{ inputs.target == '本番' && '--prod' || '' }}

    steps:
      - name: 本番は main からだけ許す
        # 確認していない枝の中身が本番に出るのを防ぐ。
        # 「どこに出す？」と「どの枝から出す？」は別の選択なので、取り違えが起きうる。
        if: inputs.target == '本番' && github.ref_name != 'main'
        run: |
          echo "::error::本番に出せるのは main だけです。いまは ${{ github.ref_name }} が選ばれています。"
          echo "Run workflow の「Use workflow from」を main にしてから、もう一度やり直してください。"
          echo "この枝の中身を確かめたいだけなら「確認用」を選んでください。"
          exit 1

      - uses: actions/checkout@v4

      - name: このコミットのテストが緑か確かめる
        # テストは走らせ直さない（マージのときに走っている）。結果だけ見る。
        # 「テスト」ワークフローのこのコミットぶんの結論を GitHub に問い合わせる。
        if: ${{ !inputs.skip_test_check }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          result=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
            --jq '[.workflow_runs[] | select(.status == "completed")] | first | .conclusion // "なし"')
          echo "このコミット（${SHA}）のテスト結果: ${result}"
          case "$result" in
            success)
              echo "テストは緑です。公開に進みます。" ;;
            なし)
              echo "::error::このコミットのテストがまだ終わっていません（または一度も走っていません）。"
              echo "Actions の「テスト」が緑になるのを待ってから、もう一度やり直してください。"
              echo "どうしても急ぐときだけ skip_test_check を on にできます。"
              exit 1 ;;
            *)
              echo "::error::このコミットのテストが ${result} です。赤いものを公開しないで止めました。"
              echo "先にテストを直してください。"
              exit 1 ;;
          esac

      - name: Vercel の設定があるか確かめる
        # 無いまま進むと Vercel CLI の英語エラーで止まって原因が分かりにくい。
        # ここで日本語で止める。
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ]      || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ]     || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Vercel の設定が足りません:$missing"
            echo "リポジトリの Settings > Secrets and variables > Actions に登録してください。"
            echo "手順は docs/deploy.md にあります。"
            exit 1
          fi

      - name: Vercel CLI を入れる
        run: npm i -g vercel@latest

      - name: Vercel から設定と環境変数を取ってくる
        # Supabase の URL や鍵は Vercel 側に置いてある。GitHub には置かない。
        run: vercel pull --yes --environment="$TARGET_ENV"

      - name: ビルドする
        # PROD_FLAG は空になることがあるので、あえて "" で囲まない。
        # shellcheck disable=SC2086
        run: vercel build $PROD_FLAG

      - name: 公開する
        id: deploy
        # vercel CLI が返す JSON は 2 通りある。--json を付けると平ら（.url）、
        # 付けないと入れ子（.deployment.url）。版によっても変わりうるので、
        # 両方拾う。実際に片方だけ見ていて落ちた。
        # shellcheck disable=SC2086
        run: |
          set -euo pipefail
          out=$(vercel deploy --prebuilt $PROD_FLAG --json)
          url=$(jq -r '.deployment.url // .url // empty' <<<"$out")
          if [ -z "$url" ]; then
            echo "::error::公開できましたが URL が取れませんでした。出力の形が変わった可能性があります。"
            echo "$out"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "## 公開しました（${{ inputs.target }}）" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TARGET_ENV" = production ]; then
            echo "**本番**: https://eriataiko.vercel.app" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "この回だけの URL（ログインが必要）: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**確認用**: $url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 確認用の固定 URL を貼り替える
        # PREVIEW_ALIAS を設定していれば、毎回同じ URL で開けるようにする。
        # 未設定なら何もしない（上の一時 URL をそのまま使う）。
        if: env.TARGET_ENV == 'preview' && vars.PREVIEW_ALIAS != ''
        run: |
          set -euo pipefail
          vercel alias set "${{ steps.deploy.outputs.url }}" "${{ vars.PREVIEW_ALIAS }}"
          echo "**固定URL**: https://${{ vars.PREVIEW_ALIAS }}" >> "$GITHUB_STEP_SUMMARY"
