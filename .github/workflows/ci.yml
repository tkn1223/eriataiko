name: テスト

# いつ動くか:
#   - develop / main に向けて PR を作ったとき
#   - develop / main にマージされたとき
#
# **公開はしない。** 公開は「公開する」ワークフロー（deploy.yml）を
# 人が手で動かしたときだけ走る。
#
# マージのたびに公開まで走るのは無駄なので分けた。
# ただし公開側はこのワークフローの結果を見て、緑でなければ止まる。

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 同じブランチに続けて push したら、古い実行は打ち切る。
# 最新のコードだけ確かめれば十分なので、待ち時間を無駄にしない。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 型・lint・テスト・画面
    runs-on: ubuntu-latest
    # DB の起動とブラウザの取得を含めて 5 分前後。
    # 20 分を超えたら何かが固まっているので落とす。
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Node を用意する
        uses: actions/setup-node@v4
        with:
          # 手元と同じ版を使う（.node-version は 1 箇所で管理する）
          node-version-file: .node-version
          cache: npm

      - name: パッケージを入れる
        run: npm ci

      - name: 型・lint・整形
        run: npm run check

      - name: DB を起動する
        # tests/rls.test.ts が本物の DB に対して「他人に書き換えられないか」を確かめる。
        # 本番が壊れる設定ミスを実際にここで捕まえたので、CI でも必ず起動する。
        run: npx supabase start

      - name: DB の接続情報を .env.test に書き直す
        # Supabase の CLI が上がると鍵が変わることがある。
        # 毎回いま動いている DB から作り直せば、鍵ずれで落ちなくなる。
        run: npm run test:env

      - name: テスト
        run: npm test

      - name: 日本語フォントを入れる
        # **画面テストの命綱。** 下の「画面テスト」は 390px で崩れていないかを
        # 数値で測る。日本語の字形が変われば文字幅も変わり、測定が意味を失う。
        #
        # 入れるのは Noto Sans JP。src/app/globals.css の --font-material が
        # 'Noto Sans JP' を名指ししており、Android の実機で使われるものと同じ。
        #
        # 以前は下の `--with-deps` が Ubuntu の配布サーバーから日本語フォント
        # （fonts-ipafont-gothic）を取ってきていた。だがそこが不調だと止まる。
        # 2026-08-19 は 10 分 28 秒無言になり、人が手で止めた。npm から入れれば
        # 版が package-lock.json で固定され、外の配布サーバーに一切触らない。
        run: |
          set -euo pipefail
          mkdir -p ~/.fonts
          cp node_modules/@expo-google-fonts/noto-sans-jp/400Regular/*.ttf ~/.fonts/
          cp node_modules/@expo-google-fonts/noto-sans-jp/700Bold/*.ttf ~/.fonts/
          fc-cache -f
          # 本当にそれが選ばれるかを見る。ここが違うフォントを指していたら、
          # 下の測定は当てにならない。
          echo "日本語に使われるフォント: $(fc-match -f '%{family}' 'Noto Sans JP')"

      - name: ブラウザを入れる
        # `--with-deps` は付けない。あれは OS の部品を Ubuntu の配布サーバーから
        # 取りに行くが、ubuntu-latest には最初から入っている（外して 54/55 件が
        # 通ることを実測した）。唯一足りなかった日本語フォントは、上の手順で
        # npm から入れている。これでテストが外の配布サーバーに依存しなくなった。
        run: npx playwright install chromium

      - name: 画面テスト
        # スマホ幅（390px）で崩れていないかを実際に測る。
        # 見た目の判断は当てにならないので、必ずここで数値を取る。
        run: npm run test:e2e

      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
