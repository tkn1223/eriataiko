name: テスト

# いつ動くか:
#   - develop / main に向けて PR を作ったとき
#   - develop / main にマージされたとき
#
# **公開はしない。** 公開は「公開する」ワークフロー（deploy.yml）を
# 人が手で動かしたときだけ走る。
#
# マージのたびに公開まで走るのは無駄なので分けた。
# ただし公開側はこのワークフローの結果を見て、緑でなければ止まる。
#
# **画面テスト（実ブラウザ）はここでは走らせない。** PR のたびに流すのは大げさなので、
# 公開の直前に 1 回だけ流す（deploy.yml）。落ちたら公開されない。

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 同じブランチに続けて push したら、古い実行は打ち切る。
# 最新のコードだけ確かめれば十分なので、待ち時間を無駄にしない。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 型・lint・テスト
    runs-on: ubuntu-latest
    # DB の起動を含めて数分。
    # 20 分を超えたら何かが固まっているので落とす。
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Node を用意する
        uses: actions/setup-node@v4
        with:
          # 手元と同じ版を使う（.node-version は 1 箇所で管理する）
          node-version-file: .node-version
          cache: npm

      - name: パッケージを入れる
        run: npm ci

      - name: 型・lint・整形
        run: npm run check

      - name: DB を起動する
        # tests/rls.test.ts が本物の DB に対して「他人に書き換えられないか」を確かめる。
        # 本番が壊れる設定ミスを実際にここで捕まえたので、CI でも必ず起動する。
        run: npx supabase start

      - name: DB の接続情報を .env.test に書き直す
        # Supabase の CLI が上がると鍵が変わることがある。
        # 毎回いま動いている DB から作り直せば、鍵ずれで落ちなくなる。
        run: npm run test:env

      - name: テスト
        run: npm test
